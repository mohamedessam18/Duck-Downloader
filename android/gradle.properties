org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.incremental=false
android.builtInKotlin=true
android.newDsl=false
adMobAppId=ca-app-pub-8105551932366170~3399993415

# Gradle's default HTTP timeout is 30s, which is shorter than this network's
# round trip to storage.googleapis.com — the Flutter engine artifacts live
# there, and a single request measured 80s. The default turned that into
# "Connection reset" and three failed builds totalling well over an hour, on a
# jar that was already sitting complete and checksum-valid in the cache.
systemProp.org.gradle.internal.http.socketTimeout=900000
systemProp.org.gradle.internal.http.connectionTimeout=900000
