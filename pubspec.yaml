name: duck_downloader
description: "Duck Downloader - Copy. Detect. Download."
publish_to: 'none'
version: 1.1.1+7

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  in_app_purchase: ^3.2.3
  just_audio: ^0.10.5
  audio_session: ^0.1.19
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  video_player: ^2.10.1
  web_socket_channel: ^3.0.3
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  photo_view: ^0.15.0
  just_audio_background: ^0.0.1-beta.17
  ffmpeg_kit_flutter_new: ^4.5.1
  liquid_glass_plus: ^0.3.2
  google_mobile_ads: ^5.1.0
  youtube_explode_dart: ^3.1.0
  receive_sharing_intent: 1.8.1
  local_auth: ^2.2.0
  file_picker: ^8.0.0
  camera: ^0.10.5+9
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/branding/logo_launcher_square_composed.png
  adaptive_icon_background: "#101112"
  adaptive_icon_foreground: assets/images/branding/logo_launcher_square.png
  remove_alpha_ios: true
  background_color_ios: "#101112"

flutter:
  uses-material-design: true
  assets:
    - assets/images/branding/
    - assets/images/branding/liquid_glass_layers/
    - assets/images/ducks/
    - assets/images/ducks/premium/
    - assets/images/ducks/frames/classic/idle/
    - assets/images/ducks/frames/classic/loading/
    - assets/images/ducks/frames/classic/success/
    - assets/images/ducks/frames/classic/error/
    - assets/images/ducks/frames/premium/idle/
    - assets/images/ducks/frames/premium/loading/
    - assets/images/ducks/frames/premium/success/
    - assets/images/ducks/frames/premium/error/
    - assets/sounds/
