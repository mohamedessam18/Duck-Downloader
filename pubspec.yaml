name: duck_downloader
description: "Duck Downloader - Copy. Detect. Download."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  just_audio: ^0.10.5
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  video_player: ^2.10.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - Duck logo.png
    - duck_idle.png
    - duck_loading.png
    - duck_success.png
    - duck_error.png
    - duck_angry.png
    - assets/boost duck.png
